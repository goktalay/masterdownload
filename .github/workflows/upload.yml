# Daha önce yayınlanmış bir GitHub Release'in exe'lerini mastertool.download'a yükler (var olanlar 409 ile atlanır).
# Actions › "mastertool.download'a yükle" › Run workflow › etiket (ör. v1.0.0).
name: mastertool.download'a yükle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sürüm etiketi (ör. v1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release'teki exe'leri indir
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" -p 'Master-Download-Setup-*.exe' -p 'Master-Download-Portable-*.exe' -D dist

      - name: mastertool.download'a yükle
        env:
          MD_RELEASE_KEY: ${{ secrets.MD_RELEASE_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          V="${TAG#v}"
          bash scripts/upload-masterdownload.sh "$V" "dist/Master-Download-Setup-$V.exe" "" "dist/Master-Download-Portable-$V.exe"

# Her itmede ve PR'da birim testleri Linux ve Windows'ta çalışır.
# "v1.2.3" gibi bir etiket gönderilince: sürümü etiketten alır, eklentiyi ve Windows exe'lerini derler, GitHub Release'e
# ekler ve mastertool.download'a yükler. Actions sekmesinden elle çalıştırılınca (workflow_dispatch) yalnızca derler.
name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test

  build-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sürümü etiketten al
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci

      # Tarayıcı eklentisi (Chromium + Firefox) kurulumun içine konur: extension/dist → resources/extension
      - name: Eklentiyi derle
        run: node extension/build.js

      - name: Exe'leri derle
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: Master-Download-windows
          path: dist/*.exe
          retention-days: 14

      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

      # Exe kullanıcılara mastertool.download hesabından (ortak oturumla) dağıtılır.
      # Anahtar depo secret'ı MD_RELEASE_KEY'dedir; tanımlı değilse adım atlanır.
      - name: mastertool.download'a yükle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MD_RELEASE_KEY: ${{ secrets.MD_RELEASE_KEY }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          bash scripts/upload-masterdownload.sh "$V" "dist/Master-Download-Setup-$V.exe" "" "dist/Master-Download-Portable-$V.exe"
